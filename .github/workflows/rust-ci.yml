name: Rust Toolchain CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact execution SHA
        id: sha
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            expected="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            expected="$DISPATCH_SHA"
          else
            expected="$EVENT_SHA"
          fi
          test -n "$expected"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_EXECUTION_SHA=$expected"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.sha.outputs.expected }}
      - name: Verify exact execution SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.expected }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXECUTION_SHA=$actual"
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust check
        run: cargo check --workspace --all-targets
      - name: Rust tests
        run: cargo test --workspace --all-targets
